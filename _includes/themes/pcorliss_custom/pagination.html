<nav class="pagination" aria-label="Post navigation">
  {% if page.previous %}
    <a class="prev" href="{{ BASE_PATH }}{{ page.previous.url }}" title="{{ page.previous.title | escape }}">&larr; Previous: {{ page.previous.title }}</a>
  {% endif %}
  {% if page.next %}
    <a class="next" href="{{ BASE_PATH }}{{ page.next.url }}" title="{{ page.next.title | escape }}">Next: {{ page.next.title }} &rarr;</a>
  {% endif %}
</nav>
